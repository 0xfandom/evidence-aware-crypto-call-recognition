[project]
name = "evidence-aware-crypto-call-recognition"
version = "0.2.0"
description = "Evidence-bound recognition of current own crypto BUY recommendations, on the synthetic-buy-assessment-v1 contract"
authors = [
    { name = "0xfandom", email = "kashyapshivank01@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evidence-aware-crypto-call-recognition = "evidence_aware_crypto_call_recognition.cli:main"
eacr = "evidence_aware_crypto_call_recognition.cli:main"
eacr-web = "evidence_aware_crypto_call_recognition.web:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_aware_crypto_call_recognition = ["web/index.html"]
